name = "cf-code-assistant"
main = "src/index.ts"
compatibility_date = "2026-04-12"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

[ai]
binding = "AI"

# Create with: npx wrangler kv namespace create "OAUTH_KV"
# Then paste the id below
[[kv_namespaces]]
binding = "OAUTH_KV"
id = "81c76a033ce6491e8e89532625d50bc4"

[observability]
enabled = true

[[ratelimits]]
name = "AUTH_RATE_LIMITER"
namespace_id = "1"
simple = { limit = 5, period = 60 }
